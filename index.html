<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Transferring Portfolio…</title>

    <!-- SEO + Redirect -->
    <meta http-equiv="refresh" content="3; url=https://sddion.vercel.app/" />
    <link rel="canonical" href="https://sddion.vercel.app/" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Luckiest+Guy&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: #0d0d0d;
        color: #f2f2f2;
        font-family: "Anonymous Pro", monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        text-align: center;
      }

      h1 {
        font-size: 2rem;
        color: #00ffee;
        margin-bottom: 1rem;
      }

      p {
        font-size: 1.1rem;
        color: #ccc;
        margin-bottom: 2rem;
      }

      .transfer-container {
        display: flex;
        align-items: center;
        gap: 3rem;
        position: relative;
      }

      .server {
        width: 80px;
        height: 80px;
        background: #111;
        border: 2px solid #00ffee;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        color: #00ffee;
        position: relative;
      }

      .data-dot {
        width: 12px;
        height: 12px;
        background: #00ffee;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
        animation: moveData 3s linear infinite;
      }

      @keyframes moveData {
        0% { left: 0; opacity: 0; }
        25% { opacity: 1; }
        50% { left: 50%; opacity: 1; }
        75% { opacity: 75%; }
        100% { left: 100%; opacity: 0; }
      }

      .arrow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 60px;
        height: 4px;
        background: #00ffee55;
        transform: translate(-50%, -50%);
        animation: pulseArrow 1.5s infinite;
      }

      @keyframes pulseArrow {
        0%, 100% { background-color: #00ffee55; }
        50% { background-color: #00ffee; }
      }

      .redirect-box {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="redirect-box">
      <h1>📡 Transferring Portfolio…</h1>
      <p>Moving data from the old server to <strong>Vercel</strong></p>

      <div class="transfer-container">
        <div class="server">🖥️</div>
        <div class="arrow"></div>
        <div class="server">☁️</div>
        <div class="data-dot"></div>
      </div>

      <p>If you are not redirected automatically, <a href="https://sddion.vercel.app/">click here</a>.</p>
    </div>

    <script>
      // JS fallback redirect
      setTimeout(() => {
        window.location.replace("https://sddion.vercel.app/");
      }, 3000);
    </script>
  </body>
</html>
